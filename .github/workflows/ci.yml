name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: Native acceptance - Node ${{ matrix.node }}, no Python (primary acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json engines says >=20. Node 20 leaves support in April 2026, so
        # 22 and 24 are the lines that matter; 20 is kept to prove the floor.
        # The capability study was executed on 24.x only — see docs/CAPABILITY.md.
        # OS coverage is documented in docs/CONFORMANCE.md: ubuntu-latest here,
        # macOS as the development platform, Windows not tested.
        node: ['20', '22', '24']
    steps:
      # This job is the acceptance gate, and it is the reason there is no
      # setup-python step anywhere in it. Everything below runs on Node's own
      # runtime: `node --test` for the suites, `node:crypto` for SHA-512/256, and
      # the JavaScript runner and guard in scripts/. A reference comparison against
      # the Python toolkit exists too - it is the `reference` job below, labelled
      # supplemental, and it is not what accepts this library.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact dependency pins
        run: npm ci --ignore-scripts
      - name: Vendored copies and pinned drafts still match their provenance
        run: node scripts/check-vendoring.mjs
      - name: Check the licence in LICENSE and package.json
        run: node scripts/check-license.mjs
      - name: Docs match the registry, and the capability matrix is current
        run: |
          node scripts/check-docs.mjs --commands
          node scripts/make-matrix.mjs --check
      - name: Capability (i) - draft/2020-12 against the released contracts
        run: node scripts/capability/ajv-dialect.mjs
      - name: Capability (ii) - SHA-512/256 against every valid sequence vector
        run: node scripts/capability/digest.mjs conformance
      - name: Native acceptance, accounted (zero tests, missing vectors and unexplained skips all fail)
        run: node scripts/check-test-report.mjs --json test-report.json
      - name: Shared conformance vectors, per-format table
        run: node scripts/run-conformance.mjs | tee conformance-table.txt
      - name: Upload the native test report and the vector table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-acceptance-node-${{ matrix.node }}
          path: |
            test-report.json
            conformance-table.txt
          if-no-files-found: error

  reference:
    name: Differential against the released Python toolkit (supplemental evidence, not acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job answers "does this library disagree with the reference
    # implementation?". It is evidence, and it is not the gate: the `native` job
    # above is, and it passes with no Python installed. A new test never depends
    # on this job, and nothing here is the oracle for a vector - the pinned
    # manifest and the native assertions are.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install the reference toolkit at the version the shared CI pins
        # fair-bioheaders 0.12.0 is the version FAIR-bioHeaders-Specification's
        # conformance job installs (conformance/toolkit-pin.json on its main, read
        # 2026-11-18). It bundles v0.6.0, the release the vendored vectors come from.
        run: |
          python -m venv "$RUNNER_TEMP/fhr-reference"
          "$RUNNER_TEMP/fhr-reference/bin/python" -m pip install "fair-bioheaders==0.12.0"
      - name: Install exact dependency pins
        run: npm ci --ignore-scripts
      - name: Capability (iii) - YAML stage against bioheaders.load_yaml + check_finite
        env:
          FHR_PYTHON: ${{ runner.temp }}/fhr-reference/bin/python
        run: node scripts/capability/yaml-portability-differential.mjs --sweep
      - name: Validity and strip bytes against the toolkit CLI
        env:
          FHR_TOOLKIT_BIN: ${{ runner.temp }}/fhr-reference/bin
        run: node scripts/capability/toolkit-crosscheck.mjs conformance

  # Draft-pin freshness. Advisory, and it gates nothing.
  #
  # `draft-pins.mjs --check`, below in the draft-lane job, compares the pinned digests
  # against a checkout of the owning repository AT the pinned commit. That is the
  # acceptance-relevant question for the lane. This job asks the different one the lane
  # must never be confused with: is the revision this build pinned still what the owning
  # repository publishes on its DEFAULT BRANCH? A draft legitimately moves, so a DRIFT is
  # expected news rather than a broken build, and the job runs with continue-on-error.
  # Nothing here re-pins: re-pinning is the deliberate act of changing bytes, commit,
  # digest and the prose that quotes them in one commit (CONTRIBUTING.md). The script
  # fetches a nonsense path from each owning repository before judging anything and stops
  # if that does not come back 404, so neither a pass nor a drift can be an artefact of a
  # portal page or a soft-200 error document.
  draft-pin-freshness:
    name: Draft-pin freshness against live raw main (advisory, labelled draft, not acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Compare every pinned draft target with the owning repository's live default branch
        # No `npm ci` and no dependency: the script imports only this repository's own
        # source and uses node:crypto and the global fetch. Native, and read-only towards
        # the two development repositories - it fetches over anonymous HTTPS and writes
        # nothing outside its own report file.
        run: node scripts/ci/draft-pin-freshness.mjs --json draft-freshness.json | tee draft-freshness.txt
      - name: Upload the freshness report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: draft-pin-freshness
          path: |
            draft-freshness.json
            draft-freshness.txt
          if-no-files-found: error

  draft-lane:
    name: Draft lane against the owning repositories' development suites (labelled draft, not acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # FHT and FHGM are drafts. This job never claims support: it runs the two
    # development suites that live in the repositories that own those types,
    # through the explicit rule-V7 lane, and prints a table labelled draft. The
    # checkouts are pinned to the commits `drafts/provenance.json` pins, so the
    # bytes being read are the bytes the lane says it reads. Acceptance stays in
    # the `native` job, on the shared suite.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install exact dependency pins
        run: npm ci --ignore-scripts
      - name: Read the pinned draft commits out of this build's own registry
        id: pins
        run: node scripts/ci/draft-pins.mjs --github-output
      # Unauthenticated clones, not actions/checkout: the two owning repositories
      # are public, and a full clone works whether or not the pinned commit is
      # reachable from their default branch. Nothing here writes to them, and no
      # credential is passed.
      - name: Clone the two owning repositories at the pinned commits
        run: |
          git clone --quiet "https://github.com/FAIR-bioHeaders/${{ steps.pins.outputs.fht-repo }}" .upstream/FHT-Specification
          git -C .upstream/FHT-Specification checkout --detach --quiet "${{ steps.pins.outputs.fht-commit }}"
          git clone --quiet "https://github.com/FAIR-bioHeaders/${{ steps.pins.outputs.fhgm-repo }}" .upstream/FHGM-Specification
          git -C .upstream/FHGM-Specification checkout --detach --quiet "${{ steps.pins.outputs.fhgm-commit }}"
          git -C .upstream/FHT-Specification rev-parse HEAD
          git -C .upstream/FHGM-Specification rev-parse HEAD
      - name: Confirm the checked-out draft bytes still match this build's pin
        run: node scripts/ci/draft-pins.mjs --check .upstream/FHT-Specification .upstream/FHGM-Specification
      # The suite is a separate claim from the contract, pinned to a separate field:
      # after the 2026-11-18 re-pin both FHT revisions name one commit (86438f21 last
      # touched both `fht.json` and the 82-vector `C1`-`C3` suite manifest) and all three
      # FHGM targets name 06176262, but the fields stay separate and are checked
      # separately, because the claims differ - the checkout moves to the suite revision
      # only after the contract bytes above have been confirmed, and the manifest is then
      # verified before a single vector is scored. A type whose registry row states no
      # suite pin stays where it is, and says so as UNPINNED rather than being silently
      # blessed.
      - name: Move each checkout to the suite revision its pin names
        run: |
          set -eu
          for pair in "FHT-Specification ${{ steps.pins.outputs.fht-suite-commit }}" "FHGM-Specification ${{ steps.pins.outputs.fhgm-suite-commit }}"; do
            dir=${pair%% *}
            rev=${pair##* }
            if [ -n "$rev" ] && [ "$rev" != "$(git -C ".upstream/$dir" rev-parse HEAD)" ]; then
              git -C ".upstream/$dir" checkout --detach --quiet "$rev"
            fi
            echo "$dir at $(git -C ".upstream/$dir" rev-parse HEAD)"
          done
      - name: Confirm each development suite is the suite this build's pin names
        run: node scripts/ci/suite-pin.mjs --check .upstream/FHT-Specification .upstream/FHGM-Specification
      # The guard above has to be shown capable of failing, or its verdict is decoration.
      # Three controls, on the case-sensitive Linux runner: the pinned bytes are accepted;
      # the same bytes with one character appended are refused with DRIFT; and a path that
      # differs from the pinned one only in case is refused with ABSENT rather than being
      # resolved by a case-insensitive filesystem. This step exits non-zero if any control
      # behaves the wrong way, including if the byte mutation turns out to change nothing.
      - name: Negative controls for the suite-pin guard
        run: |
          set -eu
          good="$RUNNER_TEMP/suite-controls/good"
          moved="$RUNNER_TEMP/suite-controls/one-byte"
          cased="$RUNNER_TEMP/suite-controls/wrong-case"
          rm -rf "$RUNNER_TEMP/suite-controls"
          mkdir -p "$good/conformance" "$moved/conformance" "$cased/Conformance"
          cp .upstream/FHT-Specification/conformance/manifest.json "$good/conformance/manifest.json"
          cp .upstream/FHT-Specification/conformance/manifest.json "$moved/conformance/manifest.json"
          cp .upstream/FHT-Specification/conformance/manifest.json "$cased/Conformance/manifest.json"
          printf 'x' >> "$moved/conformance/manifest.json"
          if cmp -s "$good/conformance/manifest.json" "$moved/conformance/manifest.json"; then
            echo "control 2 is a vacuous no-op: the mutation changed zero bytes"
            exit 1
          fi
          node scripts/ci/suite-pin.mjs --check "$good" > "$RUNNER_TEMP/suite-controls/good.log" 2>&1
          grep -q VERIFIED "$RUNNER_TEMP/suite-controls/good.log"
          if node scripts/ci/suite-pin.mjs --check "$moved" > "$RUNNER_TEMP/suite-controls/moved.log" 2>&1; then
            echo "control 2 failed: a manifest with one extra byte was accepted as the pinned suite"
            exit 1
          fi
          grep -q DRIFT "$RUNNER_TEMP/suite-controls/moved.log"
          if node scripts/ci/suite-pin.mjs --check "$cased" > "$RUNNER_TEMP/suite-controls/cased.log" 2>&1; then
            echo "control 3 failed: conformance/manifest.json resolved through a differently cased directory"
            exit 1
          fi
          grep -q ABSENT "$RUNNER_TEMP/suite-controls/cased.log"
          echo "suite-pin controls behaved: pinned bytes VERIFIED, one byte DRIFT, wrong case ABSENT"
      - name: Run both development suites through the lane
        run: node scripts/capability/draft-vectors.mjs --fht .upstream/FHT-Specification --fhgm .upstream/FHGM-Specification --verbose | tee draft-lane-evidence.txt
      - name: Upload the draft-lane evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: draft-lane-evidence
          path: draft-lane-evidence.txt
          if-no-files-found: error
